services:
  - type: web
    name: autobrillo-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTOBRILLO_MODEL
        value: /tmp/model_data.json
      - key: ML_SITE
        value: MLM
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI
        sync: false
      - key: AUTOBRILLO_TOKEN_KEY
        sync: false
