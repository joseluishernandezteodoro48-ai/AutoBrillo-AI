services:
  - type: web
    name: autobrillo-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTOBRILLO_DRY_RUN
        value: "true"
      - key: AUTOBRILLO_KILL_SWITCH
        value: "false"
      - key: AUTOBRILLO_MODEL
        value: /tmp/model_data.json
      - key: ML_SITE
        value: MLM
      - key: ML_PKCE_ENABLED
        value: "false"
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI
        sync: false
      - key: AUTOBRILLO_TOKEN_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: autobrillo-ai-db
          property: connectionString

databases:
  - name: autobrillo-ai-db
    plan: free
    region: oregon
    postgresMajorVersion: 18
