services:
  - type: web
    name: autobrillo-ai
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTOBRILLO_DRY_RUN
        value: "true"
      - key: AUTOBRILLO_KILL_SWITCH
        value: "false"
      - key: AUTOBRILLO_RATE_LIMIT
        value: "60"
      - key: AUTOBRILLO_MODEL
        value: /tmp/model_data.json
      - key: AUTOBRILLO_SUPPLIER_FEED
        value: suppliers.json
      - key: AUTOBRILLO_PRODUCT_SOURCE
        value: mercadolibre
      - key: ML_SITE
        value: MLM
      - key: ML_PKCE_ENABLED
        value: "true"
      # Categoría por defecto (cámbiala por una real de tu cuenta / nicho)
      # Ejemplo orientativo MLM: MLM1055 = Celulares y Teléfonos
      - key: ML_DEFAULT_CATEGORY_ID
        value: ""
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI
        sync: false
      - key: AUTOBRILLO_TOKEN_KEY
        sync: false
      - key: AUTOBRILLO_ADMIN_KEY
        sync: false
      - key: AUTOBRILLO_WEBHOOK_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: autobrillo-ai-db
          property: connectionString

databases:
  - name: autobrillo-ai-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
