name: AutoBrillo AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Smoke test deployed application entrypoint
        env:
          AUTOBRILLO_MODEL: /tmp/model_data.json
          AUTOBRILLO_DRY_RUN: "true"
          AUTOBRILLO_KILL_SWITCH: "false"
        run: python -c "from main import app; print(app.title, app.version)"
